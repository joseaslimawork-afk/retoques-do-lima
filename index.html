<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retoques do Lima - Audiovisuais</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b1b3b 0%, #1f4c8f 50%, #6fa8ff 100%);
            min-height: 100vh;
            color: #333;
            display: flex;
            flex-direction: column;
        }

        header {
            background: white;
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .logo {
            color: #1f4c8f;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .hero {
            text-align: center;
        }

        .cta-btn {
            padding: 1rem 3rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 600;
            background: white;
            color: #1f4c8f;
            display: inline-block;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 1.5rem;
            }

            .cta-btn {
                padding: 0.8rem 2rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Retoques do Lima - Audiovisuais</div>
    </header>

    <main>
        <div class="hero">
            <div class="cta-buttons">
                <a href="index inicio.html" class="cta-btn btn-primary">Começar</a>
        </div>
    </main>
</body>
</html>
